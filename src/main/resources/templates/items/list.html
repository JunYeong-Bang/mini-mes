<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('품목 목록')}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main-content">
        <header class="page-header">
            <div><p class="eyebrow">기준정보</p><h1>품목 관리</h1><p class="text-secondary mb-0">가공할 부품의 품번, 품목명과 도면 정보를 관리합니다.</p></div>
            <a class="btn btn-primary" th:href="@{/items/new}">품목 등록</a>
        </header>
        <div th:if="${message}" class="alert alert-success" role="status" th:text="${message}"></div>
        <section class="card workspace-card" aria-label="품목 목록">
            <div class="card-body border-bottom">
                <form method="get" th:action="@{/items}" class="row g-2 align-items-end">
                    <div class="col-sm-8 col-lg-6">
                        <label for="q" class="form-label">품번 또는 품목명 검색</label>
                        <input id="q" name="q" class="form-control" th:value="${q}" maxlength="100" placeholder="예: DEMO-SHAFT 또는 구동축">
                    </div>
                    <div class="col-auto"><button type="submit" class="btn btn-outline-primary">검색</button></div>
                    <div class="col-auto"><a class="btn btn-outline-secondary" th:href="@{/items}">전체 보기</a></div>
                </form>
            </div>
            <div class="card-body pb-0"><p class="text-secondary">조회 <strong th:text="${items.totalElements}">0</strong>건 · 비활성 품목 포함</p></div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <caption class="visually-hidden">품목 목록. 한 페이지에 최대 20건을 표시합니다.</caption>
                    <thead><tr><th scope="col">품번</th><th scope="col">품목명</th><th scope="col">도면번호</th><th scope="col">사용 여부</th><th scope="col">수정일</th><th scope="col">관리</th></tr></thead>
                    <tbody>
                    <tr th:if="${items.empty}"><td colspan="6" class="empty-state">조회된 품목이 없습니다. 품목을 등록하거나 검색어를 변경해 주세요.</td></tr>
                    <tr th:each="item : ${items}">
                        <td class="item-code" th:text="${item.itemCode}"></td>
                        <td th:text="${item.itemName}"></td>
                        <td th:text="${#strings.isEmpty(item.drawingNumber) ? '—' : item.drawingNumber}"></td>
                        <td><span th:class="${item.active ? 'badge text-bg-success' : 'badge text-bg-secondary'}" th:text="${item.active ? '사용' : '비활성'}"></span></td>
                        <td class="text-nowrap text-secondary" th:text="${#temporals.format(item.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
                        <td><a class="btn btn-sm btn-outline-secondary" th:href="@{/items/{id}/edit(id=${item.id})}" th:aria-label="${item.itemCode} + ' 수정'">수정</a></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-body d-flex gap-3 align-items-center" th:if="${items.totalPages > 0}">
                <a th:if="${items.hasPrevious()}" class="btn btn-sm btn-outline-secondary" th:href="@{/items(q=${q},page=${items.number - 1})}">이전</a>
                <span class="text-secondary" th:text="${items.number + 1} + ' / ' + ${items.totalPages} + ' 페이지'"></span>
                <a th:if="${items.hasNext()}" class="btn btn-sm btn-outline-secondary" th:href="@{/items(q=${q},page=${items.number + 1})}">다음</a>
            </div>
        </section>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </main>
</div>
</body>
</html>
